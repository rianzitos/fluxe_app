# Compila o SICAPDA nos servidores do GitHub, sem precisar de Android Studio nem de Visual Studio:
#   • Android  → SICAPDA.apk            (+ app.json)
#   • Windows  → SICAPDA-Setup.exe      (+ app-windows.json), instalador feito com Inno Setup
#
#  • A cada Pull Request / push na main: analisa, testa e compila. Os arquivos ficam na aba "Actions" →
#    execução → "Artifacts" → SICAPDA-downloads (um .zip com tudo, pronto para copiar para
#    storage/downloads do SystemFluxe).
#  • Ao criar uma tag de versão (ex.: v1.0.0): além disso, publica uma Release com os instaladores anexados.
#      git tag v1.0.0 && git push origin v1.0.0
#
# Assinatura do Android: com os secrets abaixo o APK sai assinado com a SUA chave (necessário para que as
# atualizações instalem por cima da versão anterior). Sem eles, usa a chave de debug (ok para testes).
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, (opcional) ANDROID_KEY_PASSWORD
# O instalador do Windows ainda não é assinado digitalmente (o SmartScreen avisa na primeira execução).
# Passo a passo no README ("Gerar e publicar o aplicativo").

name: Build do aplicativo

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (analisar, testar e compilar o APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Configurar assinatura (opcional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } > android/key.properties
            echo "Assinando com a chave de release dos secrets."
          else
            echo "::notice::Sem secrets de assinatura: o APK usa a chave de debug (ok para testes; para atualizar um app já instalado será preciso desinstalá-lo antes)."
          fi

      # O Maven Central às vezes responde "429 Too Many Requests" para os servidores do GitHub.
      # O Gradle repete os downloads com espera crescente e, se ainda assim falhar, repetimos o build.
      - name: Compilar APK (release)
        run: |
          mkdir -p ~/.gradle
          {
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=4000"
          } >> ~/.gradle/gradle.properties

          # Só arquiteturas ARM (todos os celulares e tablets Android): sem x86_64 (emuladores de PC)
          # o arquivo fica bem menor. Para emulador, use `flutter run`.
          for tentativa in 1 2 3 4; do
            if flutter build apk --release --target-platform android-arm,android-arm64; then
              exit 0
            fi
            echo "::warning::Tentativa $tentativa do build falhou (provável limite de requisições do Maven Central). Aguardando para tentar de novo..."
            sleep $((tentativa * 75))
          done
          exit 1

      - name: Preparar arquivos de publicação (SICAPDA.apk + app.json)
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SICAPDA.apk

          VERSAO_LINHA="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')"
          VERSAO="${VERSAO_LINHA%%+*}"
          BUILD="${VERSAO_LINHA##*+}"; [ "$BUILD" = "$VERSAO_LINHA" ] && BUILD=0
          SHA256="$(sha256sum dist/SICAPDA.apk | cut -d' ' -f1)"
          TAMANHO="$(stat -c%s dist/SICAPDA.apk)"

          # minSdk real do APK compilado (a página mostra "Android X ou superior")
          AAPT2="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)"
          MIN_SDK=""
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump permissions dist/SICAPDA.apk || true
            MIN_SDK="$("$AAPT2" dump xmltree --file AndroidManifest.xml dist/SICAPDA.apk 2>/dev/null \
              | sed -n 's/.*minSdkVersion[^=]*=\(([^)]*)\)\{0,1\}\(0x[0-9a-fA-F]*\|[0-9][0-9]*\).*/\2/p' | head -1 || true)"
            if [ -z "$MIN_SDK" ]; then
              MIN_SDK="$("$AAPT2" dump badging dist/SICAPDA.apk 2>/dev/null | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" | head -1 || true)"
            fi
            # xmltree pode devolver hexadecimal (0x18): converte para decimal
            case "$MIN_SDK" in 0x*) MIN_SDK="$((MIN_SDK))" ;; esac
            echo "minSdk detectado: '${MIN_SDK}'"
            "$AAPT2" dump xmltree --file AndroidManifest.xml dist/SICAPDA.apk 2>/dev/null | grep -iE "minSdk|targetSdk|versionName|versionCode" || true
          fi

          jq -n \
            --arg arquivo "SICAPDA.apk" --arg versao "$VERSAO" --argjson build "$BUILD" \
            --argjson tamanho "$TAMANHO" --arg sha256 "$SHA256" \
            --arg min_sdk "$MIN_SDK" --arg atualizado_em "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{arquivo:$arquivo, versao:$versao, build:$build, tamanho:$tamanho, sha256:$sha256,
              min_sdk:(if $min_sdk == "" then null else ($min_sdk|tonumber) end), atualizado_em:$atualizado_em}' \
            > dist/app.json
          cat dist/app.json

      - uses: actions/upload-artifact@v4
        with:
          name: SICAPDA-apk
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------------------------------
  windows:
    name: Windows (compilar e gerar o instalador)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Compilar para Windows (release)
        run: flutter build windows --release

      # O Inno Setup costuma vir na imagem do GitHub; se não vier, instala (com repetição, o Chocolatey às vezes falha).
      - name: Garantir o Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { Write-Host "Inno Setup já instalado."; exit 0 }
          foreach ($tentativa in 1..3) {
            choco install innosetup -y --no-progress
            if (Test-Path $iscc) { exit 0 }
            Start-Sleep -Seconds (10 * $tentativa)
          }
          throw "Não foi possível instalar o Inno Setup."

      - name: Gerar o instalador (SICAPDA-Setup.exe + app-windows.json)
        shell: pwsh
        run: ./tool/empacotar_windows.ps1 -Saida dist

      # Teste de fumaça: instala em silêncio, abre o app e confere que ele continua rodando (se faltasse alguma
      # DLL, o Windows fecharia o programa na hora). Depois desinstala.
      - name: Testar o instalador (instalar, abrir e desinstalar)
        shell: pwsh
        run: |
          $pasta = Join-Path $env:RUNNER_TEMP 'sicapda-instalado'
          $inst = Start-Process -FilePath (Resolve-Path dist/SICAPDA-Setup.exe).Path -PassThru -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$pasta"
          if ($inst.ExitCode -ne 0) { throw "O instalador terminou com código $($inst.ExitCode)" }

          $exe = Join-Path $pasta 'SICAPDA.exe'
          if (-not (Test-Path $exe)) { throw 'SICAPDA.exe não foi instalado.' }
          Get-ChildItem $pasta | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "O aplicativo fechou sozinho (código $($app.ExitCode))." }
          Write-Host "O aplicativo abriu e continua rodando (PID $($app.Id), janela: '$($app.MainWindowTitle)')."

          # captura da tela com o app aberto (vira artefato para conferir a aparência no Windows de verdade)
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $tela = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $tela.Width, $tela.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($tela.Location, [System.Drawing.Point]::Empty, $tela.Size)
            $g.Dispose()
            New-Item -ItemType Directory -Force captura | Out-Null
            $img.Save((Join-Path (Resolve-Path captura).Path 'SICAPDA-no-windows.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "Captura salva ($($tela.Width)x$($tela.Height))."
          } catch { Write-Host "Não foi possível capturar a tela: $($_.Exception.Message)" }

          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          $un = Join-Path $pasta 'unins000.exe'
          if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait }
          Write-Host 'Instalação, abertura e desinstalação funcionaram.'

      - uses: actions/upload-artifact@v4
        with:
          name: SICAPDA-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: SICAPDA-windows-captura
          path: captura/
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------------------------------------
  pacote:
    name: Reunir os arquivos para o site
    needs: [android, windows]
    # Se o Windows falhar, ainda entrega o APK (e o job "windows" fica vermelho para alguém olhar).
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SICAPDA-apk
          path: SICAPDA-downloads

      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: SICAPDA-windows
          path: SICAPDA-downloads

      - name: Conferir o pacote
        run: |
          ls -la SICAPDA-downloads
          for f in SICAPDA-downloads/*.json; do echo "== $f"; cat "$f"; echo; done

      - uses: actions/upload-artifact@v4
        with:
          name: SICAPDA-downloads
          path: SICAPDA-downloads/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, pacote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SICAPDA-downloads
          path: dist

      - name: Criar Release com os instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SICAPDA ${GITHUB_REF_NAME}" \
            --generate-notes
